<h1>{{name}}</h1>

<dl>
  <td>Nombre:</td>
  <dd>{{name}}</dd>

  <td>Edad:</td>
  <dd>{{age}}</dd>

  <td>Método:</td>
  <dd>{{getHeroDescription()}}</dd>

  <td>Capitalizado:</td>
  <dd>{{capitalizeName}}</dd>
</dl>

@if (name !== 'Spiderman') {
  <button
    class="btn btn-primary mx-2"
    (click)="changeHero()">
    Cambiar nombre
  </button>
}
@if (age !== 50) {
  <button
    class="btn btn-primary"
    (click)="changeAge()">
    Cambiar edad
  </button>
}

@if (name === 'Spiderman' && age === 50) {
  <button
    class="btn btn-danger mx-2"
    (click)="resetValues()">
    Resetear valores
  </button>
}
